<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INA Pro - Strategic HR Partner</title>
  <meta name="theme-color" content="#020617">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen w-screen m-0 p-0 font-sans select-none overflow-hidden">

  <!-- Encabezado Pro -->
  <header class="bg-gradient-to-r from-purple-950 via-purple-900 to-indigo-950 text-white p-2.5 flex items-center justify-between border-b border-purple-800/50 shadow-lg shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-xs shadow-md">
        INA
      </div>
      <div>
        <h1 class="font-bold text-xs leading-tight">INA HR Pro</h1>
        <p class="text-[9px] text-purple-300/80">Operaciones de personal</p>
      </div>
    </div>
    <div class="flex gap-1.5">
      <button onclick="alternarModalKey()" class="text-[10px] font-bold bg-purple-800/60 hover:bg-purple-700 text-purple-200 px-2.5 py-1 rounded-lg border border-purple-600/40">
        🔑 Clave
      </button>
      <button onclick="generarReporteJefe()" class="text-[10px] font-bold bg-indigo-800/60 hover:bg-indigo-700 text-indigo-200 px-2.5 py-1 rounded-lg border border-indigo-600/40">
        📊 Jefe
      </button>
    </div>
  </header>

  <!-- Modal para la API Key -->
  <div id="modal-key" class="hidden bg-slate-900 border-b border-purple-500/40 p-2.5 flex flex-col gap-2 shrink-0">
    <p class="text-xs text-purple-300 font-bold">🔑 Configurar tu API Key de Gemini:</p>
    <div class="flex gap-2">
      <input type="password" id="input-key" placeholder="Pega tu clave AI Studio aquí..." class="flex-1 bg-slate-950 border border-purple-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none focus:border-purple-500">
      <button onclick="guardarKey()" class="bg-purple-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Guardar</button>
    </div>
  </div>

  <!-- Navegación de Pestañas -->
  <div class="flex border-b border-purple-900/40 bg-slate-950 shrink-0">
    <button onclick="cambiarPestana('chat')" id="btn-chat" class="flex-1 py-2 text-xs font-bold border-b-2 border-purple-500 text-purple-300 bg-purple-950/20">
      💬 Chat IA
    </button>
    <button onclick="cambiarPestana('agenda')" id="btn-agenda" class="flex-1 py-2 text-xs font-bold text-slate-400">
      📋 Tablero
    </button>
    <button onclick="cambiarPestana('nomina')" id="btn-nomina" class="flex-1 py-2 text-xs font-bold text-slate-400">
      👥 Nómina
    </button>
  </div>

  <!-- VISTA CHAT -->
  <div id="vista-chat" class="flex-1 flex flex-col min-h-0 bg-slate-900/80 overflow-hidden relative pb-14">
    <div id="contenedor-mensajes" class="flex-1 overflow-y-auto p-3 space-y-2.5">
      <div class="flex justify-start">
        <div class="max-w-[92%] bg-slate-800/90 border border-purple-500/20 rounded-2xl rounded-bl-none p-3 text-xs text-slate-200 shadow-lg leading-relaxed">
          <p class="font-semibold text-purple-300 mb-1">💼 INA conectada a la Nómina de Planta.</p>
          Escribe o díctame el torbellino de novedades de tus recorridas. Las cruzaré con el personal registrado y tus variables.
        </div>
      </div>
    </div>
