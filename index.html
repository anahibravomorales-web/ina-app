<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INA - Tu Asistente Personal</title>
  <!-- Tailwind CSS para un diseño moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen w-screen flex flex-col justify-center items-center m-0 p-0 overflow-hidden">

  <div class="w-full max-w-md h-full sm:h-[92vh] bg-white sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    
    <!-- Encabezado -->
    <header class="bg-emerald-600 text-white p-4 flex items-center gap-3 shadow-md select-none">
      <div class="w-10 h-10 rounded-full bg-emerald-800 flex items-center justify-center font-bold text-lg border-2 border-emerald-300">
        INA
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">INA</h1>
        <p class="text-xs text-emerald-100">Tu Asistente Personal</p>
      </div>
    </header>

    <!-- Pestañas de Navegación -->
    <div class="flex border-b bg-gray-50 select-none">
      <button onclick="cambiarPestana('chat')" id="btn-chat" class="flex-1 py-3 text-sm font-bold border-b-2 border-emerald-600 text-emerald-600 bg-white transition">
        💬 Chat
      </button>
      <button onclick="cambiarPestana('agenda')" id="btn-agenda" class="flex-1 py-3 text-sm font-bold text-gray-500 transition">
        📋 Agenda
      </button>
    </div>

    <!-- VISTA 1: CHAT -->
    <div id="vista-chat" class="flex-1 flex flex-col justify-between overflow-hidden bg-slate-50">
      <div id="contenedor-mensajes" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex justify-start">
          <div class="max-w-[85%] bg-white text-gray-800 border rounded-2xl rounded-bl-none px-4 py-3 text-sm shadow-sm">
            ¡Hola! Soy <b>INA</b>, tu asistente personal. Escribime aquí tus novedades, tareas u observaciones como si me hablaras por WhatsApp.
          </div>
        </div>
      </div>
      <div class="p-3 bg-white border-t flex gap-2 items-center">
        <input 
          type="text" 
          id="input-mensaje" 
          placeholder="Escribile a INA..." 
          onkeydown="if(event.key === 'Enter') enviarMensaje()"
          class="flex-1 border border-gray-300 rounded-full px-4 py-2.5 text-sm outline-none focus:border-emerald-600"
        />
        <button onclick="enviarMensaje()" class="bg-emerald-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold hover:bg-emerald-700 transition shadow">
          ➔
        </button>
      </div>
    </div>

    <!-- VISTA 2: AGENDA -->
    <div id="vista-agenda" class="flex-1 p-3 flex flex-col overflow-hidden bg-gray-50 hidden">
      <div class="flex gap-2 overflow-x-auto pb-2 shrink-0">
        <button onclick="filtrarAgenda('hoy')" id="f-hoy" class="filtro-btn px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white shadow-sm">Hoy</button>
        <button onclick="filtrarAgenda('pendientes')" id="f-pendientes" class="filtro-btn px-3 py-1 rounded-full text-xs font-bold bg-white text-gray-600 border">Pendientes</button>
        <button onclick="filtrarAgenda('seguimiento')" id="f-seguimiento" class="filtro-btn px-3 py-1 rounded-full text-xs font-bold bg-white text-gray-600 border">Seguimiento</button>
      </div>
      <div id="lista-agenda" class="flex-1 overflow-y-auto space-y-2 mt-2 pr-1">
        <!-- Elementos de la agenda -->
      </div>
    </div>

  </div>

  <script>
    let items = JSON.parse(localStorage.getItem('ina_items')) || [
      { text: 'Liquidación: Juan Pérez llegó tarde', categoria: 'Novedad', estado: 'hoy' },
      { text: 'Desempeño: observar a Facundo', categoria: 'Observación', estado: 'seguimiento' },
      { text: 'Falta realizar denuncia por accidente de Luis', categoria: 'Problema', estado: 'pendientes' }
    ];

    let filtroActual = 'hoy';

    function cambiarPestana(pestana) {
      if (pestana === 'chat') {
        document.getElementById('vista-chat').classList.remove('hidden');
        document.getElementById('vista-agenda').classList.add('hidden');
        document.getElementById('btn-chat').className = "flex-1 py-3 text-sm font-bold border-b-2 border-emerald-600 text-emerald-600 bg-white transition";
        document.getElementById('btn-agenda').className = "flex-1 py-3 text-sm font-bold text-gray-500 transition";
      } else {
        document.getElementById('vista-chat').classList.add('hidden');
        document.getElementById('vista-agenda').classList.remove('hidden');
        document.getElementById('btn-agenda').className = "flex-1 py-3 text-sm font-bold border-b-2 border-emerald-600 text-emerald-600 bg-white transition";
        document.getElementById('btn-chat').className = "flex-1 py-3 text-sm font-bold text-gray-500 transition";
        renderAgenda();
      }
    }

    function enviarMensaje() {
      const input = document.getElementById('input-mensaje');
      const texto = input.value.trim();
      if (!texto) return;

      const contenedor = document.getElementById('contenedor-mensajes');
      
      contenedor.innerHTML += `
        <div class="flex justify-end">
          <div class="max-w-[85%] bg-emerald-600 text-white rounded-2xl rounded-br-none px-4 py-2.5 text-sm shadow-sm">
            ${texto}
          </div>
        </div>
      `;
      input.value = '';
      contenedor.scrollTop = contenedor.scrollHeight;

      setTimeout(() => {
        let cat = 'Novedad';
        let est = 'hoy';
        const lower = texto.toLowerCase();

        if (lower.includes('comprar') || lower.includes('tengo que') || lower.includes('falta')) {
          cat = 'Tarea'; est = 'pendientes';
        } else if (lower.includes('observar') || lower.includes('dificultad')) {
          cat = 'Observación'; est = 'seguimiento';
        } else if (lower.includes('accidente') || lower.includes('problema')) {
          cat = 'Problema'; est = 'pendientes';
        }

        items.unshift({ text: texto, categoria: cat, estado: est });
        localStorage.setItem('ina_items', JSON.stringify(items));

        contenedor.innerHTML += `
          <div class="flex justify-start">
            <div class="max-w-[85%] bg-white text-gray-800 border rounded-2xl rounded-bl-none px-4 py-2.5 text-sm shadow-sm">
              Anotado como <b>${cat}</b>. Quedó guardado en la sección <b>${est.toUpperCase()}</b>.
            </div>
          </div>
        `;
        contenedor.scrollTop = contenedor.scrollHeight;
      }, 400);
    }

    function filtrarAgenda(estado) {
      filtroActual = estado;
      document.querySelectorAll('.filtro-btn').forEach(btn => {
        btn.className = "filtro-btn px-3 py-1 rounded-full text-xs font-bold bg-white text-gray-600 border";
      });
      document.getElementById(`f-${estado}`).className = "filtro-btn px-3 py-1 rounded-full text-xs font-bold bg-emerald-600 text-white shadow-sm";
      renderAgenda();
    }

    function renderAgenda() {
      const lista = document.getElementById('lista-agenda');
      const filtrados = items.filter(i => i.estado === filtroActual);
      
      if (filtrados.length === 0) {
        lista.innerHTML = `<p class="text-center text-gray-400 text-sm py-8">Sin registros en esta sección.</p>`;
        return;
      }

      lista.innerHTML = filtrados.map(i => `
        <div class="bg-white p-3 rounded-lg border border-gray-200 shadow-sm flex flex-col gap-1">
          <span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded w-max">${i.categoria}</span>
          <p class="text-sm font-medium text-gray-800">${i.text}</p>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
